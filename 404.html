<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Dimensão não encontrada // XenomorphSk</title>
<meta name="description" content="Dimensão não encontrada — XenomorphSk">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=IBM+Plex+Mono:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  --void: #07090a;
  --portal-1: #6dffb8;
  --portal-2: #1fb6c9;
  --acid: #d4ff3d;
  --alert: #ff3b5c;
  --ink: #cfe8da;
  --ink-dim: #7c948a;
  --line: #1d2b25;
  --mono: 'JetBrains Mono', monospace;
  --pmono: 'IBM Plex Mono', monospace;
}
*{ margin:0; padding:0; box-sizing:border-box; }
body{
  background:var(--void); color:var(--ink); font-family:var(--pmono);
  min-height:100vh; display:flex; align-items:center; justify-content:center;
  overflow:hidden; -webkit-font-smoothing:antialiased;
}
a{ color:inherit; text-decoration:none; }

.scanlines{
  position:fixed; inset:0; pointer-events:none; z-index:2;
  background:repeating-linear-gradient(to bottom, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 1px, transparent 1px, transparent 3px);
  mix-blend-mode:overlay; opacity:.5;
}
.vignette{
  position:fixed; inset:0; pointer-events:none; z-index:1;
  background:radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,.6) 100%);
}

.wrap{ text-align:center; padding:6vh 6vw; position:relative; z-index:3; }

.eyebrow{
  font-family:var(--mono); font-size:11.5px; letter-spacing:.2em; text-transform:uppercase;
  color:var(--portal-1); margin-bottom:26px;
}

.code{
  font-family:var(--mono); font-weight:800; font-size:clamp(60px,14vw,160px);
  line-height:1; color:var(--ink); position:relative; letter-spacing:-.02em;
}
.code span{ position:relative; display:inline-block; }
.code .glitch1, .code .glitch2{
  position:absolute; top:0; left:0; width:100%; overflow:hidden;
}
.code .glitch1{ color:var(--alert); clip-path:inset(0 0 0 0); animation:glitchTop 3.2s infinite linear; opacity:.7; }
.code .glitch2{ color:var(--acid); clip-path:inset(0 0 0 0); animation:glitchBottom 2.6s infinite linear; opacity:.7; }

@keyframes glitchTop{
  0%,100%{ clip-path:inset(0 0 95% 0); transform:translate(0,0); }
  10%{ clip-path:inset(10% 0 60% 0); transform:translate(-3px,-2px); }
  20%{ clip-path:inset(40% 0 20% 0); transform:translate(3px,1px); }
  30%{ clip-path:inset(0 0 90% 0); transform:translate(0,0); }
  55%{ clip-path:inset(60% 0 5% 0); transform:translate(2px,-1px); }
  70%{ clip-path:inset(0 0 95% 0); transform:translate(0,0); }
}
@keyframes glitchBottom{
  0%,100%{ clip-path:inset(90% 0 0 0); transform:translate(0,0); }
  15%{ clip-path:inset(55% 0 10% 0); transform:translate(3px,2px); }
  35%{ clip-path:inset(20% 0 50% 0); transform:translate(-2px,1px); }
  50%{ clip-path:inset(90% 0 0 0); transform:translate(0,0); }
  75%{ clip-path:inset(30% 0 40% 0); transform:translate(2px,-2px); }
}

.title{
  font-family:var(--mono); font-weight:800; font-size:clamp(18px,3vw,28px);
  text-transform:uppercase; color:var(--ink); margin-top:22px; letter-spacing:-.01em;
}
.sub{
  margin-top:18px; color:var(--ink-dim); font-size:13.5px; line-height:1.8; max-width:480px;
  margin-left:auto; margin-right:auto;
}
.sub .path{ color:var(--acid); }

.btn{
  display:inline-flex; align-items:center; gap:8px; margin-top:38px;
  font-family:var(--mono); font-size:12px; letter-spacing:.06em; text-transform:uppercase;
  padding:13px 24px; border:1px solid var(--portal-1); color:var(--portal-1);
  background:transparent; transition:all .2s ease;
}
.btn:hover{ background:var(--portal-1); color:#06160f; }

.footer-note{
  margin-top:60px; font-size:11px; color:var(--ink-dim); letter-spacing:.05em;
}
</style>
</head>
<body>

<div class="scanlines"></div>
<div class="vignette"></div>

<div class="wrap">
  <div class="eyebrow">system://erro_de_navegação</div>

  <div class="code">
    <span>404</span>
    <span class="glitch1" aria-hidden="true">404</span>
    <span class="glitch2" aria-hidden="true">404</span>
  </div>

  <div class="title">Dimensão não encontrada</div>
  <p class="sub">
    O portal tentou abrir em <span class="path" id="badPath">/caminho/desconhecido</span>
    e não encontrou nada do outro lado. Ou essa dimensão nunca existiu, ou ainda não foi
    mapeada.
  </p>

  <a class="btn" href="index.html">← voltar pro portal principal</a>

  <div class="footer-note">XenomorphSk · C-137 · nenhum ramo do multiverso tem essa página</div>
</div>

<script>
document.getElementById('badPath').textContent = location.pathname || '/desconhecido';
</script>

</body>
</html>
